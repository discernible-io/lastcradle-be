server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: https://178.128.173.226:3100/loki/api/v1/push
    tls_config:
      insecure_skip_verify: true # Required for self-signed certs

scrape_configs:
  - job_name: node_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: servertestapi
          host: 178.128.173.226
          app: servertestapi
          __path__: /app/logs/*.log # Correct path syntax
    pipeline_stages:
      - regex:
          expression: '(?P<filename>[^/]+)\.log$'
      - regex:
          expression: '(?P<component>api|nginx|system)(?P<logtype>error|access|info)'
          source: filename
      - labels:
          component:
          logtype:
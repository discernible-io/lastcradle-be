name: Deploy Node.js API

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA to deploy'
        required: true
        default: ''

env:
  SSH_HOST: 178.62.195.21
  SSH_USER: ${{ secrets.SSH_USER }}
  API_DOMAIN: api.discernible.io
  API_PORT: 9443
  NODE_VERSION: 20
  NEAR_RPC_URL: ${{ secrets.NEAR_RPC_URL }}

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Upload Swagger artifact
        uses: actions/upload-artifact@v4
        with:
          name: swagger-spec
          path: api-docs/swagger.json

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          name: id_rsa
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          
      - name: Setup and Copy Files
        run: |
          echo "Setting up directories..."
          ssh ${{ env.SSH_USER }}@${{ env.SSH_HOST }} "mkdir -p ~/servertest-app/{certs,logs,data,nginx} && mkdir -p ~/servertest-app/logs/nginx && chmod 0775 ~/servertest-app/logs/nginx || true && podman unshare chown -R 101:101 ~/servertest-app/logs/nginx || true"
          
          echo "Setting up certificate permissions..."
          ssh ${{ env.SSH_USER }}@${{ env.SSH_HOST }} "podman unshare chown 101:101 ~/servertest-app/certs/privkey.pem ~/servertest-app/certs/fullchain.pem || true"
           
          echo "Copying API files..."
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'certs' \
            --exclude 'logs' \
            --exclude 'data' \
            ./ ${{ env.SSH_USER }}@${{ env.SSH_HOST }}:~/servertest-app/

      - name: Show all runner environment variables (sanitized)
        run: |
          echo 'Runner environment (sanitized):'
          printenv | sort | sed -E 's/(PASSWORD|SECRET|TOKEN|KEY|AUTH)=.*/\1=****/I'
          echo 'Testing Loki reachability from runner:'
          curl -sS -k "${{ vars.LOKI_URL }}/loki/api/v1/status/buildinfo" || true

      - name: Deploy Containers
        run: |
          ssh ${{ env.SSH_USER }}@${{ env.SSH_HOST }} "
            export TERM=dumb
            export VSCODE_SHELL_INTEGRATION=0
            unset PROMPT_COMMAND || true
            unset -f __vsc_prompt_cmd __vsc_preexec_only __vsc_precmd __vsc_command_complete __vsc_update_cwd 2>/dev/null || true
            set -euxo pipefail
            cd ~/servertest-app
            echo 'Remote host environment (sanitized):'
            printenv | sort | sed -E 's/(PASSWORD|SECRET|TOKEN|KEY|AUTH)=.*/\1=****/I' || true
            echo 'Testing Loki reachability from remote host:'
            curl -sS -k '${{ vars.LOKI_URL }}/loki/api/v1/status/buildinfo' || true
            
            # Clean up existing resources
            echo 'Cleaning up existing resources...'
            podman pod exists servertest-pod && podman pod rm -f servertest-pod
            podman image exists servertest-image:latest && podman rmi -f servertest-image:latest
            podman image exists localhost/servertest-nginx:latest && podman rmi -f localhost/servertest-nginx:latest
            
            # Create new pod
            echo 'Creating API pod...'
            podman pod create --name servertest-pod -p ${API_PORT}:${API_PORT}
            
            # Ensure logs and data directories exist with correct permissions
            echo 'Setting up logs and data directories...'
            mkdir -p ~/servertest-app/logs ~/servertest-app/data
            # Set permissions to 0775 for directories and 0664 for files
            # Set ownership to 1000:1000 (nodeuser:nodeuser in container)
            podman unshare chown -R 1000:1000 ~/servertest-app/logs ~/servertest-app/data || true
            # Ensure the data directory is writable by the container user
            podman unshare chmod g+w ~/servertest-app/data
            
            # Build API container with debug information
            echo 'Building API container...'
            echo 'DEBUG: NODE_ENV=${{ vars.NODE_ENV }}'
            echo 'DEBUG: LOG_LEVEL=${{ vars.LOG_LEVEL }}'
            echo 'DEBUG: LOKI_URL=${{ vars.LOKI_URL }}'
            echo 'DEBUG: LOKI_TLS_SKIP_VERIFY=${{ vars.LOKI_TLS_SKIP_VERIFY }}'
            echo 'DEBUG: WEBHOOK_TLS_SKIP_VERIFY=${{ vars.WEBHOOK_TLS_SKIP_VERIFY }}'
            LOKI_BASIC_AUTH_VALUE='${{ secrets.LOKI_BASIC_AUTH }}'
            if [ -n "${LOKI_BASIC_AUTH_VALUE}" ]; then
              echo "DEBUG: LOKI_BASIC_AUTH length: ${#LOKI_BASIC_AUTH_VALUE}"
            else
              echo 'DEBUG: LOKI_BASIC_AUTH length: 0'
            fi
            echo 'DEBUG: RODIT_NEAR_CREDENTIALS_SOURCE=${{ vars.RODIT_NEAR_CREDENTIALS_SOURCE }}'
            echo 'DEBUG: SERVICE_NAME=${{ vars.SERVICE_NAME }}'
            echo 'DEBUG: API_DEFAULT_OPTIONS_LOG_DIR=${{ vars.API_DEFAULT_OPTIONS_LOG_DIR }}'
            echo 'DEBUG: NEAR_RPC_URL=${{ env.NEAR_RPC_URL }}'
            echo 'DEBUG: NEAR_CONTRACT_ID=${{ vars.NEAR_CONTRACT_ID }}'
            echo 'DEBUG: NEAR_CREDENTIALS_FILE_PATH=${{ vars.NEAR_CREDENTIALS_FILE_PATH }}'
            echo 'DEBUG: MINTING_FEEACCOUNT=${{ vars.MINTING_FEEACCOUNT }}'
            echo 'DEBUG: MINTING_FEE=${{ vars.MINTING_FEE }}'
            echo 'DEBUG: API_VERSION=${{ vars.API_VERSION }}'
            # Do not echo NEAR_CREDENTIALS_JSON_B64 or Vault secrets to avoid leaking secrets
            echo 'DEBUG: VAULT_ENDPOINT=${{ vars.VAULT_ENDPOINT }}'
            echo 'DEBUG: VAULT_RODIT_KEYVALUE_PATH=${{ vars.VAULT_RODIT_KEYVALUE_PATH }}'
            echo 'DEBUG: VAULT_ROLE_ID: [provided via secrets]'
            echo 'DEBUG: VAULT_SECRET_ID: [provided via secrets]'
            echo 'DEBUG: VAULT_TOKEN_TTL=${{ vars.VAULT_TOKEN_TTL }}'
            echo 'DEBUG: SECURITY_OPTIONS_LAPSED_LIFETIME_PROPORTION_4RENEWAL_ELIGIBILITY=${{ vars.SECURITY_OPTIONS_LAPSED_LIFETIME_PROPORTION_4RENEWAL_ELIGIBILITY }}'
            echo 'DEBUG: SECURITY_OPTIONS_THRESHOLD_VALIDATION_TYPE=${{ vars.SECURITY_OPTIONS_THRESHOLD_VALIDATION_TYPE }}'
            echo 'DEBUG: SECURITY_OPTIONS_DURATIONRAMP=${{ vars.SECURITY_OPTIONS_DURATIONRAMP }}'
            echo 'DEBUG: SECURITY_OPTIONS_SERVERORCLIENT=${{ vars.SECURITY_OPTIONS_SERVERORCLIENT }}'
            echo 'DEBUG: SECURITY_OPTIONS_SILENT_LOGIN_FAILURES=${{ vars.SECURITY_OPTIONS_SILENT_LOGIN_FAILURES }}'
            echo 'DEBUG: SECURITY_OPTIONS_LOGIN_MODE=${{ vars.SECURITY_OPTIONS_LOGIN_MODE }}'
            echo 'DEBUG: API_DEFAULT_OPTIONS_DB_PATH=${{ vars.API_DEFAULT_OPTIONS_DB_PATH }}'
            podman build -t servertest-image:latest -f api.Dockerfile .
            
            # Run API container with user 1000 and proper volume mounts
            echo 'Running API container...'
            podman run -d \
              --pod servertest-pod \
              --name servertest-container \
              --user 1000:1000 \
              --restart=unless-stopped \
              -e NODE_ENV='${{ vars.NODE_ENV }}' \
              -e LOG_LEVEL='${{ vars.LOG_LEVEL }}' \
              -e LOKI_URL='${{ vars.LOKI_URL }}' \
              -e LOKI_TLS_SKIP_VERIFY='${{ vars.LOKI_TLS_SKIP_VERIFY }}' \
              -e WEBHOOK_TLS_SKIP_VERIFY='${{ vars.WEBHOOK_TLS_SKIP_VERIFY }}' \
              -e LOKI_BASIC_AUTH='${{ secrets.LOKI_BASIC_AUTH }}' \
              -e RODIT_NEAR_CREDENTIALS_SOURCE='${{ vars.RODIT_NEAR_CREDENTIALS_SOURCE }}' \
              -e SERVICE_NAME='${{ vars.SERVICE_NAME }}' \
              -e NEAR_CONTRACT_ID='${{ vars.NEAR_CONTRACT_ID }}' \
              -e NEAR_CREDENTIALS_JSON_B64='${{ secrets.NEAR_CREDENTIALS_JSON_B64 }}' \
              -e NEAR_RPC_URL='${{ env.NEAR_RPC_URL }}' \
              -e NEAR_CREDENTIALS_FILE_PATH='${{ vars.NEAR_CREDENTIALS_FILE_PATH }}' \
              -e MINTING_FEEACCOUNT='${{ vars.MINTING_FEEACCOUNT }}' \
              -e MINTING_FEE='${{ vars.MINTING_FEE }}' \
              -e API_VERSION='${{ vars.API_VERSION }}' \
              -e VAULT_ENDPOINT='${{ vars.VAULT_ENDPOINT }}' \
              -e VAULT_RODIT_KEYVALUE_PATH='${{ vars.VAULT_RODIT_KEYVALUE_PATH }}' \
              -e VAULT_ROLE_ID='${{ secrets.VAULT_ROLE_ID }}' \
              -e VAULT_SECRET_ID='${{ secrets.VAULT_SECRET_ID }}' \
              -e VAULT_TOKEN_TTL='${{ vars.VAULT_TOKEN_TTL }}' \
              -e SECURITY_OPTIONS_LAPSED_LIFETIME_PROPORTION_4RENEWAL_ELIGIBILITY='${{ vars.SECURITY_OPTIONS_LAPSED_LIFETIME_PROPORTION_4RENEWAL_ELIGIBILITY }}' \
              -e SECURITY_OPTIONS_THRESHOLD_VALIDATION_TYPE='${{ vars.SECURITY_OPTIONS_THRESHOLD_VALIDATION_TYPE }}' \
              -e SECURITY_OPTIONS_DURATIONRAMP='${{ vars.SECURITY_OPTIONS_DURATIONRAMP }}' \
              -e SECURITY_OPTIONS_SERVERORCLIENT='${{ vars.SECURITY_OPTIONS_SERVERORCLIENT }}' \
              -e SECURITY_OPTIONS_SILENT_LOGIN_FAILURES='${{ vars.SECURITY_OPTIONS_SILENT_LOGIN_FAILURES }}' \
              -e SECURITY_OPTIONS_LOGIN_MODE='${{ vars.SECURITY_OPTIONS_LOGIN_MODE }}' \
              -e API_DEFAULT_OPTIONS_DB_PATH='${{ vars.API_DEFAULT_OPTIONS_DB_PATH }}' \
              -v ~/servertest-app/logs:/app/logs:Z \
              -v ~/servertest-app/data:/app/data:Z \
              -v ~/servertest-app/certs:/app/certs:ro,Z \
              servertest-image:latest
            
            # Wait for container to fully start
            sleep 5
            
            # Debug: Check if container is running
            echo 'DEBUG: Container status:'
            podman ps -a | grep servertest-container || echo 'Container not found'
            
            # Debug: Check environment variables inside the container
            echo 'DEBUG: Container environment variables:'
            podman exec servertest-container env \
              | grep -E '^(NODE_ENV|LOG_LEVEL|LOKI_|WEBHOOK_TLS_SKIP_VERIFY|RODIT_NEAR_CREDENTIALS_SOURCE|SERVICE_NAME|API_DEFAULT_OPTIONS_|NEAR_|VAULT_|MINTING_|API_VERSION|SECURITY_OPTIONS_|SESSION_|CREDENTIALS_FILEPATH|BASE_URL)' \
              | sed -E 's/(VAULT_ROLE_ID|VAULT_SECRET_ID)=.*/\1=****/' \
              | sort || echo 'No expected variables found'

            echo 'DEBUG: NEAR_CREDENTIALS_JSON_B64 presence (length only):'
            podman exec servertest-container sh -lc 'printf "NEAR_CREDENTIALS_JSON_B64 length: %s\n" "${#NEAR_CREDENTIALS_JSON_B64}"' || true
            
            # Debug: Test a simple command in container
            echo 'DEBUG: Testing container access:'
            podman exec servertest-container echo 'Container is accessible' || echo 'Cannot access container'
            
            # Debug: Check if winston-loki is working by looking for Loki-related logs
            echo 'DEBUG: Winston-loki initialization check:'
            podman logs servertest-container 2>&1 | grep -i loki || echo 'No Loki-related log messages found'
            
            # Build and run nginx
            echo 'Building and running nginx...'
            podman build -t localhost/servertest-nginx:latest -f nginx.Dockerfile .
            # Ensure nginx log directory exists on host before mounting and is writable by container user
            mkdir -p ~/servertest-app/logs/nginx
            chmod 0775 ~/servertest-app/logs/nginx || true
            podman unshare chown -R 101:101 ~/servertest-app/logs/nginx || true
            if [ -f ~/servertest-app/certs/privkey.pem ]; then
              podman unshare chown 101:101 ~/servertest-app/certs/privkey.pem
              podman unshare chmod 640 ~/servertest-app/certs/privkey.pem
            fi
            if [ -f ~/servertest-app/certs/fullchain.pem ]; then
              podman unshare chown 101:101 ~/servertest-app/certs/fullchain.pem
              podman unshare chmod 644 ~/servertest-app/certs/fullchain.pem
            fi
            podman run -d \
              --pod servertest-pod \
              --name servertest-nginx \
              --restart=unless-stopped \
              -v ~/servertest-app/certs:/app/certs:ro,Z \
              -v ~/servertest-app/logs/nginx:/var/log/nginx:Z,U \
              localhost/servertest-nginx:latest
            
            # Check status and logs
            echo 'Container status:'
            podman ps -a
            
            echo 'API logs:'
            podman logs servertest-container || true
            
            echo 'Nginx logs:'
            podman logs servertest-nginx || true
          "
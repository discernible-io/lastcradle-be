name: Deploy Node.js API

on:
  push:
    branches: [main, development]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA to deploy"
        required: false
        default: ""

env:
  NODE_ENV: ${{ github.ref == 'refs/heads/main' && 'main' || 'development' }}
  SSH_HOST: ${{ github.ref == 'refs/heads/main' && secrets.SSH_HOST_MAIN || secrets.SSH_HOST_DEVELOPMENT }}
  SSH_USER: ${{ github.ref == 'refs/heads/main' && secrets.SSH_USER_MAIN || secrets.SSH_USER_DEVELOPMENT }}
  SSH_PRIVATE_KEY: ${{ github.ref == 'refs/heads/main' && secrets.SSH_PRIVATE_KEY_MAIN || secrets.SSH_PRIVATE_KEY_DEVELOPMENT }}
  SSH_KNOWN_HOSTS: ${{ github.ref == 'refs/heads/main' && secrets.SSH_KNOWN_HOSTS_MAIN || secrets.SSH_KNOWN_HOSTS_DEVELOPMENT }}
  DOMAIN: ${{ github.ref == 'refs/heads/main' && 'slcapi.discernible.io' || 'slcapi.dihola.io' }}
  APP_PORT: "9443"
  # Public surface is APP_PORT only. nginx must not listen on 443: rootless
  # Podman cannot bind privileged ports, and a failed :443 bind aborts nginx entirely.
  # Game UI frontend is on slc.*:10443; API is slcapi.*:9443.
  APP_DIR: ~/syntheticlc-app
  POD_NAME: syntheticlc-pod
  APP_CONTAINER_NAME: syntheticlc-container
  NGINX_CONTAINER_NAME: syntheticlc-nginx
  REGISTRY: ghcr.io
  REGISTRY_USERNAME: ${{ github.actor }}
  API_IMAGE_NAME: ${{ github.repository }}/syntheticlc-api
  NGINX_IMAGE_NAME: ${{ github.repository }}/syntheticlc-nginx
  NODE_VERSION: 20
  HEALTH_CHECK_TIMEOUT: 120
  HEALTH_CHECK_INTERVAL: 5

jobs:
  build-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.commit_sha || github.sha }}
          fetch-depth: 0

      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Enforce minimum package age
        run: node scripts/enforce-minimum-package-age.js

      - name: Install dependencies
        run: npm ci

      - name: Generate METHOD_PERMISSION_MAP from swagger.json
        env:
          NODE_ENV: ${{ env.NODE_ENV }}
        run: |
          node scripts/update-permissionsmap.js --permissions
          node scripts/update-permissionsmap.js --validate

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./api.Dockerfile
          push: true
          build-args: |
            NODE_ENV=${{ env.NODE_ENV }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push nginx image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./nginx.Dockerfile
          push: true
          build-args: |
            NODE_ENV=${{ env.NODE_ENV }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.NGINX_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.NGINX_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test-and-deploy:
    needs: build-images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deploy scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.commit_sha || github.sha }}
          sparse-checkout: |
            scripts/ensure-podman-linger.sh
            scripts/migrate-app-dir.sh

      - name: Install SSH key
        uses: shimataro/ssh-key-action@87a8f067114a8ce263df83e9ed5c849953548bc3 # v2.8.1
        with:
          key: ${{ env.SSH_PRIVATE_KEY }}
          name: id_rsa
          known_hosts: unnecessary

      - name: Refresh SSH known_hosts
        run: |
          ssh-keygen -f ~/.ssh/known_hosts -R ${{ env.SSH_HOST }} 2>/dev/null || true
          ssh-keyscan -H ${{ env.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Enable systemd linger for rootless Podman
        run: |
          ssh ${{ env.SSH_USER }}@${{ env.SSH_HOST }} "DEPLOY_USER=${{ env.SSH_USER }} bash -s" \
            < scripts/ensure-podman-linger.sh

      - name: Setup directories and login to GHCR
        run: |
          scp scripts/migrate-app-dir.sh ${{ env.SSH_USER }}@${{ env.SSH_HOST }}:/tmp/migrate-app-dir.sh
          ssh ${{ env.SSH_USER }}@${{ env.SSH_HOST }} "
            bash /tmp/migrate-app-dir.sh
            mkdir -p ${{ env.APP_DIR }}/{certs,logs,data,nginx,secrets}
            mkdir -p ${{ env.APP_DIR }}/logs/nginx
            chmod 750 ${{ env.APP_DIR }}/secrets
            chmod 711 ${{ env.APP_DIR }}/certs || true
            chmod 0775 ${{ env.APP_DIR }}/logs/nginx || true
            podman unshare chown -R 101:101 ${{ env.APP_DIR }}/logs/nginx || true
            test -f ${{ env.APP_DIR }}/secrets/secrets.env
          "
          ssh ${{ env.SSH_USER }}@${{ env.SSH_HOST }} "echo '${{ secrets.GHCR_PULL_TOKEN }}' | podman login ghcr.io -u ${{ github.actor }} --password-stdin"

      - name: Deploy containers
        run: |
          ssh ${{ env.SSH_USER }}@${{ env.SSH_HOST }} "
            set -euxo pipefail
            cd ${{ env.APP_DIR }}

            # Always force-remove (exists&&rm trips set -e when the pod is absent).
            podman pod rm -f ${{ env.POD_NAME }} || true
            # servertest → syntheticlc rename: legacy pod still binds APP_PORT until removed.
            podman pod rm -f servertest-pod || true
            podman rm -f servertest-container || true
            podman rm -f servertest-nginx || true

            podman pull ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }}
            podman pull ${{ env.REGISTRY }}/${{ env.NGINX_IMAGE_NAME }}:${{ github.sha }}

            # Re-rm immediately before create (guards against concurrent local deploys during pull).
            podman pod rm -f ${{ env.POD_NAME }} || true
            podman pod create --name ${{ env.POD_NAME }} -p ${{ env.APP_PORT }}:${{ env.APP_PORT }}

            mkdir -p ${{ env.APP_DIR }}/logs ${{ env.APP_DIR }}/data
            podman unshare chown -R 1000:1000 ${{ env.APP_DIR }}/logs ${{ env.APP_DIR }}/data || true
            podman unshare chmod g+w ${{ env.APP_DIR }}/data || true

            set +x
            podman run -d \
              --log-driver=k8s-file \
              --pod ${{ env.POD_NAME }} \
              --name ${{ env.APP_CONTAINER_NAME }} \
              --user 1000:1000 \
              --restart=unless-stopped \
              --env-file ${{ env.APP_DIR }}/secrets/secrets.env \
              -e NODE_ENV=${{ env.NODE_ENV }} \
              -v ${{ env.APP_DIR }}/logs:/app/logs:Z \
              -v ${{ env.APP_DIR }}/data:/app/data:Z \
              -v ${{ env.APP_DIR }}/certs:/app/certs:ro,Z \
              ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }}
            set -x

            chmod 711 ${{ env.APP_DIR }}/certs || true
            if [ -f ${{ env.APP_DIR }}/certs/privkey.pem ]; then
              podman unshare chown 101:101 ${{ env.APP_DIR }}/certs/privkey.pem ${{ env.APP_DIR }}/certs/fullchain.pem || true
              podman unshare chmod 600 ${{ env.APP_DIR }}/certs/privkey.pem || true
              podman unshare chmod 644 ${{ env.APP_DIR }}/certs/fullchain.pem || true
            fi

            mkdir -p ${{ env.APP_DIR }}/logs/nginx
            chmod 0775 ${{ env.APP_DIR }}/logs/nginx || true
            podman unshare chown -R 101:101 ${{ env.APP_DIR }}/logs/nginx || true

            podman run -d \
              --log-driver=k8s-file \
              --pod ${{ env.POD_NAME }} \
              --name ${{ env.NGINX_CONTAINER_NAME }} \
              --restart=unless-stopped \
              -v ${{ env.APP_DIR }}/certs:/app/certs:ro,Z \
              -v ${{ env.APP_DIR }}/logs/nginx:/var/log/nginx:Z,U \
              ${{ env.REGISTRY }}/${{ env.NGINX_IMAGE_NAME }}:${{ github.sha }}

            podman ps -a
          "

      - name: Run deployment API tests (in container, findings-only)
        continue-on-error: true
        run: |
          ssh ${{ env.SSH_USER }}@${{ env.SSH_HOST }} "
            sleep 10
            podman exec ${{ env.APP_CONTAINER_NAME }} node /app/scripts/run-deployment-api-tests.js \
              || echo 'Deployment API tests logged findings (non-blocking)'
          "

      - name: Verify HTTPS health (advisory)
        continue-on-error: true
        run: |
          end=$((SECONDS + ${{ env.HEALTH_CHECK_TIMEOUT }}))
          while [ "$SECONDS" -lt "$end" ]; do
            if curl -fsSk "https://${{ env.DOMAIN }}:${{ env.APP_PORT }}/health" | grep -qE '"status":"(healthy|degraded)"'; then
              echo "Health check passed"
              exit 0
            fi
            echo "Waiting for healthy status..."
            sleep ${{ env.HEALTH_CHECK_INTERVAL }}
          done
          echo "Health check did not pass from runner (deploy may still be OK on host)"
          exit 0
